<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__REPORT_TITLE__ · 标书解析</title>
  <style>
    :root { color-scheme:light; --brand:#3478f6; --ink:#303741; --muted:#929aa6; --line:#e7eaf0; --canvas:#f6f7fa; --surface:#fff; --tab-height:64px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:14px; line-height:1.8; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible, summary:focus-visible { outline:2px solid var(--brand); outline-offset:4px; }
    .shell { min-height:100vh; max-width:1600px; margin:auto; background:var(--surface); }
    .navigation { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--line); }
    .primary-tabs { display:flex; align-items:stretch; padding:0 28px; overflow:auto; scrollbar-width:thin; }
    .primary-tab { position:relative; flex:1 0 auto; min-height:var(--tab-height); padding:16px 15px; white-space:nowrap; border:0; background:transparent; color:#626976; }
    .primary-tab[aria-selected="true"] { color:var(--brand); font-weight:600; }
    .primary-tab[aria-selected="true"]::after { content:""; position:absolute; height:3px; bottom:0; left:15px; right:15px; background:var(--brand); border-radius:3px 3px 0 0; }
    .context-line { display:flex; justify-content:space-between; gap:20px; padding:14px 36px 5px; color:var(--muted); font-size:12px; }
    .context-line h1 { margin:0; font-size:12px; font-weight:400; max-width:70%; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; }
    .secondary-tabs { display:flex; align-items:center; gap:28px; padding:9px 36px 16px; overflow:auto; scrollbar-width:thin; }
    .secondary-tab { padding:4px 0; flex:0 0 auto; border:0; background:transparent; color:#757c88; white-space:nowrap; }
    .secondary-tab[aria-current="true"] { color:var(--brand); font-weight:600; }
    .secondary-tabs[hidden] { display:none; }
    .coverage { padding:12px 36px; background:#fff9eb; border-bottom:1px solid #f2e6c7; font-size:13px; color:#8a601a; }
    .coverage[hidden] { display:none; }
    main { padding:24px 36px 60px; }
    .section { padding-top:4px; margin-bottom:34px; scroll-margin-top:160px; }
    .section h2 { margin:0 0 18px; padding-left:12px; border-left:3px solid var(--brand); font-size:16px; line-height:1.25; font-weight:600; color:#303741; }
    .block { margin:0 0 20px; }
    .block h3 { margin:0 0 12px; font-size:14px; font-weight:600; }
    .table-wrap { width:100%; overflow:auto; border:1px solid var(--line); border-radius:5px; }
    table { width:100%; border-collapse:collapse; table-layout:auto; }
    th { padding:13px 18px; color:#606a79; background:#f7f9fc; font-weight:500; text-align:left; border-bottom:1px solid var(--line); }
    td { padding:16px 18px; vertical-align:top; overflow-wrap:anywhere; border-bottom:1px solid var(--line); }
    th + th, td + td { border-left:1px solid var(--line); }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#fafcff; }
    tbody td:first-child { font-weight:500; min-width:120px; }
    .cell-text, .text-body { white-space:pre-wrap; overflow-wrap:anywhere; }
    .text-body { margin:0; line-height:1.95; }
    .template-body { padding:22px; border:1px solid var(--line); background:#fafbfc; border-radius:5px; font-family:inherit; }
    .badge { display:inline-block; margin:0 8px 5px 0; padding:0 7px; border-radius:3px; font-size:11px; background:#fff3d9; color:#98600a; vertical-align:middle; }
    .basis-note { margin-top:8px; color:#82735b; font-size:12px; font-weight:400; }
    .evidence { margin-top:9px; color:#8993a2; font-size:12px; font-weight:400; line-height:1.7; }
    .evidence summary { width:fit-content; cursor:pointer; user-select:none; }
    .source-entry { padding:9px 12px; margin:8px 0; background:#f6f8fb; border-left:2px solid #dce4f3; color:#657287; }
    .source-entry p { margin:3px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .empty { padding:80px 20px; text-align:center; color:#929aa6; }
    .empty p { margin:0; }
    .qa-help { margin:18px 0 0; color:#929aa6; font-size:12px; }
    noscript { display:block; padding:24px; }
    @media (max-width:800px) {
      .primary-tabs { padding:0 12px; }
      .primary-tab { min-height:54px; padding:13px 12px; }
      .context-line { padding:12px 18px 4px; gap:8px; }
      .secondary-tabs { gap:22px; padding:8px 18px 12px; }
      main { padding:22px 18px 40px; }
      th, td { padding:12px; }
      .coverage { padding:10px 18px; }
      .section { scroll-margin-top:145px; }
    }
    @media print { .navigation { position:static; } .primary-tabs, .secondary-tabs { display:none; } body { background:white; } main { padding:16px; } .section { break-inside:avoid; } .evidence { display:none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="navigation">
      <div class="primary-tabs" id="primary-tabs" role="tablist" aria-label="标书分析模块"></div>
      <div class="context-line"><h1 id="document-title"></h1></div>
      <nav class="secondary-tabs" id="secondary-tabs" aria-label="当前模块内容导航"></nav>
    </header>
    <div class="coverage" id="coverage" role="status" hidden></div>
    <main id="content" role="tabpanel" tabindex="0"></main>
    <noscript>请开启 JavaScript 以查看模块；结构化解析内容也保存在对应 JSON 文件中。</noscript>
  </div>
  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    "use strict";
    const report = JSON.parse(document.getElementById("report-data").textContent);
    const primary = document.getElementById("primary-tabs");
    const secondary = document.getElementById("secondary-tabs");
    const content = document.getElementById("content");
    let activeIndex = 0;
    let observer;
    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = Array.isArray(text) ? text.join("\n") : text;
      return node;
    }
    function evidence(item, parent) {
      if (item.note) parent.append(element("div", "basis-note", item.note));
      if (!item.evidence || !item.evidence.length) return;
      const details = element("details", "evidence");
      details.append(element("summary", "", `出处（${item.evidence.length}）`));
      for (const source of item.evidence) {
        const entry = element("div", "source-entry");
        entry.append(element("p", "", `${source.file} · ${source.locator}`));
        entry.append(element("p", "", source.quote));
        details.append(entry);
      }
      parent.append(details);
    }
    function badge(item, parent) {
      if (item.basis === "inferred") parent.append(element("span", "badge", "推断"));
      if (item.basis === "missing") parent.append(element("span", "badge", "未明确"));
    }
    function blockView(block) {
      const holder = element("div", "block");
      if (block.title) holder.append(element("h3", "", block.title));
      if (block.kind === "table") {
        const wrap = element("div", "table-wrap");
        const table = element("table");
        const thead = element("thead");
        const headrow = element("tr");
        for (const heading of block.columns) {
          const th = element("th", "", heading);
          th.scope = "col";
          headrow.append(th);
        }
        thead.append(headrow);
        table.append(thead);
        const tbody = element("tbody");
        for (const row of block.rows) {
          const tr = element("tr");
          row.cells.forEach((cell, index) => {
            const td = element("td");
            if (index === 0) badge(row, td);
            td.append(element("div", "cell-text", cell));
            if (index === row.cells.length - 1) evidence(row, td);
            tr.append(td);
          });
          tbody.append(tr);
        }
        table.append(tbody);
        wrap.append(table);
        holder.append(wrap);
      } else if (block.kind === "template") {
        const link = element("a", "template-body", block.document.name);
        link.href = "./" + encodeURIComponent(block.document.name);
        link.download = block.document.name;
        holder.append(link);
        holder.append(element("p", "text-body", "请打开同目录的 Word 模板；宿主界面通过 momo-file-editor 预览。"));
        evidence(block, holder);
      } else {
        badge(block, holder);
        holder.append(element("div", "text-body", block.text));
        evidence(block, holder);
      }
      return holder;
    }
    function selectSection(index) {
      Array.from(secondary.children).forEach((button, i) => button.setAttribute("aria-current", String(i === index)));
    }
    function chooseModule(index, move = true) {
      activeIndex = index;
      if (observer) observer.disconnect();
      Array.from(primary.children).forEach((button, i) => {
        button.setAttribute("aria-selected", String(i === index));
        button.tabIndex = i === index ? 0 : -1;
      });
      content.replaceChildren();
      secondary.replaceChildren();
      const module = report.modules[index];
      content.setAttribute("aria-labelledby", `tab-${module.id}`);
      secondary.hidden = module.sections.length === 0;
      module.sections.forEach((section, sectionIndex) => {
        const sectionId = `section-${module.id}-${section.id}`;
        const button = element("button", "secondary-tab", section.title);
        button.type = "button";
        button.setAttribute("aria-controls", sectionId);
        button.addEventListener("click", () => {
          selectSection(sectionIndex);
          document.getElementById(sectionId).scrollIntoView({ behavior:"smooth", block:"start" });
        });
        secondary.append(button);
        const view = element("section", "section");
        view.id = sectionId;
        view.setAttribute("aria-labelledby", `${sectionId}-heading`);
        const heading = element("h2", "", section.title);
        heading.id = `${sectionId}-heading`;
        view.append(heading);
        for (const block of section.blocks) view.append(blockView(block));
        content.append(view);
      });
      selectSection(0);
      if (!module.sections.length) {
        const empty = element("div", "empty");
        empty.append(element("p", "", module.empty_message));
        content.append(empty);
      }
      if (module.id === "qa") content.append(element("p", "qa-help", "可在 AI 对话中继续针对本次标书提问，并要求保存问答记录。"));
      if (typeof IntersectionObserver !== "undefined" && module.sections.length) {
        observer = new IntersectionObserver(entries => {
          const visible = entries.filter(entry => entry.isIntersecting).sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top);
          if (visible.length) {
            const i = module.sections.findIndex(section => `section-${module.id}-${section.id}` === visible[0].target.id);
            if (i >= 0) selectSection(i);
          }
        }, {rootMargin:"-150px 0px -65% 0px", threshold:0});
        Array.from(content.querySelectorAll(".section")).forEach(section => observer.observe(section));
      }
      if (move) window.scrollTo({top:0, behavior:"instant"});
    }
    report.modules.forEach((module, index) => {
      const button = element("button", "primary-tab", module.title);
      button.type = "button";
      button.id = `tab-${module.id}`;
      button.setAttribute("role", "tab");
      button.setAttribute("aria-controls", "content");
      button.addEventListener("click", () => chooseModule(index));
      primary.append(button);
    });
    primary.addEventListener("keydown", event => {
      let next;
      if (event.key === "ArrowRight") next = (activeIndex + 1) % report.modules.length;
      else if (event.key === "ArrowLeft") next = (activeIndex - 1 + report.modules.length) % report.modules.length;
      else if (event.key === "Home") next = 0;
      else if (event.key === "End") next = report.modules.length - 1;
      if (next !== undefined) { event.preventDefault(); chooseModule(next); primary.children[next].focus(); }
    });
    document.getElementById("document-title").textContent = report.document_title;
    document.getElementById("document-title").title = report.document_title;
    const coverage = document.getElementById("coverage");
    if (report.coverage.status === "partial") {
      coverage.hidden = false;
      coverage.textContent = `${report.coverage.summary} 待核验：${report.coverage.unread.join("；")}`;
    }
    chooseModule(0, false);
  </script>
</body>
</html>
