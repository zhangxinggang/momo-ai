<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>求和示例</title><body><form><label>A <input name="a" type="number" step="any" required value="2"></label><label>B <input name="b" type="number" step="any" required value="3"></label><button>计算</button></form><output></output><script type="module">import {sum} from '../lib/sum.mjs';document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();try{document.querySelector('output').textContent=String(sum(Number(e.target.a.value),Number(e.target.b.value)).value);}catch(error){document.querySelector('output').textContent=error.message;}});</script></body></html>
